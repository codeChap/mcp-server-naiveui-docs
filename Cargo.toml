[package]
name = "mcp-server-naiveui-docs"
version = "0.3.0"
edition = "2024"
description = "MCP server: Naive UI component docs, APIs, and demos from the pinned library source"
license = "MIT"
readme = "README.md"
repository = "https://github.com/codeChap/mcp-server-naiveui-docs"
homepage = "https://github.com/codeChap/mcp-server-naiveui-docs"
keywords = ["mcp", "naive-ui", "vue"]
categories = ["development-tools"]

[dependencies]
rmcp = { version = "1.8.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
anyhow = "1"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
regex = "1"

[profile.release]
lto = true
strip = true
