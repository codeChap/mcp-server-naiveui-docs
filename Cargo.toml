[package]
name = "mcp-server-naive-ui"
version = "0.2.0"
edition = "2024"
description = "MCP server: Naive UI component docs, APIs, and demos from the pinned library source"
license = "MIT"

[dependencies]
rmcp = { version = "1.8.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
anyhow = "1"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
regex = "1"

[profile.release]
lto = true
strip = true
